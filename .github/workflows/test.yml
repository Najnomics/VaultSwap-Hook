name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        components: [foundry, chisel]
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
    
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Install dependencies
      run: |
        pnpm install
        forge install
    
    - name: Build contracts
      run: forge build
    
    - name: Run tests
      run: forge test --gas-report
    
    - name: Generate coverage
      run: forge coverage --ir-minimum
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-avs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
    
    - name: Test AVS Go code
      run: |
        cd avs
        go mod tidy
        go test ./... -v
    
    - name: Test AVS contracts
      run: |
        cd avs/contracts
        forge test
    
    - name: Build AVS performer
      run: |
        cd avs
        go build -o ./bin/performer ./cmd/main.go
